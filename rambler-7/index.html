<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#2a2723">
<title>Rambler 7 · Field Voice Unit</title>
<meta name="description" content="A push-to-talk voice recorder. Hold to speak, release to pause, and every burst joins one take. Recordings stay on your device.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rambler 7">
<meta property="og:type" content="website">
<meta property="og:title" content="Rambler 7 · Field Voice Unit">
<meta property="og:description" content="Hold to speak, release to pause. Every burst joins one take, stored on your device.">
<meta property="og:image" content="/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<style>
:root{
  --shell:#2a2723; --shell-hi:#4a453d; --shell-lo:#161412;
  --ink:#1b1915;
  --lcd:#101a0e; --amber:#ffb43a; --amber-dim:#7a5a1e;
  --led:#ff3a20; --btn:#c9532c; --btn-hi:#e4693c; --btn-lo:#7d2f16;
  --paper:#e6dfd0; --line:rgba(27,25,21,.18);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --pad:clamp(12px,3.5vw,17px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.ptt,.key,.tab,.mini,.acts button,.sw,.seek{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;
}
.ptt::selection,.ptt *::selection,.key::selection,.acts button::selection{background:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100dvh; overscroll-behavior:none; touch-action:manipulation;
  background:#3b3833;
  background-image:radial-gradient(120% 90% at 50% 0%,#4c473f 0%,#2b2825 70%,#201e1b 100%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--mono); font-size:14px;
  display:flex; justify-content:center;
  padding:clamp(10px,3vw,22px) clamp(8px,3vw,16px) calc(30px + env(safe-area-inset-bottom,0px));
  -webkit-user-select:none; user-select:none;
}
input{-webkit-user-select:text;user-select:text}
.app{width:100%;max-width:430px;display:flex;flex-direction:column;gap:clamp(14px,4vw,22px)}

/* ---------------- device ---------------- */
.rig{
  position:relative; border-radius:16px; padding:var(--pad) var(--pad) calc(var(--pad) + 4px);
  background:linear-gradient(180deg,var(--shell-hi) 0%,var(--shell) 8%,var(--shell) 88%,var(--shell-lo) 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 -3px 0 rgba(0,0,0,.45) inset,0 18px 34px rgba(0,0,0,.45);
}
.rig::before,.rig::after{
  content:"";position:absolute;top:9px;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#8d8577,#3a352e 70%);
  box-shadow:0 1px 0 rgba(255,255,255,.12);
}
.rig::before{left:9px}.rig::after{right:9px}

.head{display:flex;align-items:center;gap:12px;margin-bottom:clamp(10px,3vw,14px)}
.grille{
  flex:1 1 auto;min-width:0;height:clamp(30px,9vw,40px);border-radius:5px;background-color:#151311;
  background-image:radial-gradient(circle,#3d3831 1.4px,transparent 1.6px);background-size:7px 7px;
  box-shadow:0 1px 0 rgba(255,255,255,.09),inset 0 3px 7px rgba(0,0,0,.75);
}
.mark{flex:0 0 auto;text-align:right;color:#ded4bc;line-height:1.15}
.mark b{display:block;font-size:clamp(13px,4vw,15px);letter-spacing:.16em;font-weight:700}
.mark small{display:block;font-size:clamp(7.5px,2.4vw,8.5px);letter-spacing:.22em;color:#8f877a}

.screen{display:flex;gap:10px;margin-bottom:clamp(12px,3.5vw,16px)}
.lcd{
  flex:1 1 auto;min-width:0;border-radius:6px;padding:9px clamp(8px,3vw,12px) 8px;background:var(--lcd);
  box-shadow:inset 0 3px 10px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.09);
  position:relative;overflow:hidden;color:var(--amber);
}
.lcd::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);opacity:.55;
}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:6px;
  font-size:clamp(8px,2.6vw,9.5px);letter-spacing:.12em;opacity:.85}
.lrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-size:clamp(25px,8.5vw,31px);font-weight:700;line-height:1.15;margin:3px 0 2px;
  font-variant-numeric:tabular-nums;text-shadow:0 0 9px rgba(255,180,58,.45)}
.ghost{position:relative}
.ghost s{position:absolute;left:0;top:0;text-decoration:none;color:var(--amber-dim);opacity:.32;text-shadow:none}
.led{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:#4a1a12;box-shadow:inset 0 0 3px #000}
.led.on{background:var(--led);box-shadow:0 0 10px rgba(255,58,32,.9),0 0 3px #fff inset}
.vu{flex:0 0 clamp(76px,25vw,104px);border-radius:6px;padding:4px;
  background:linear-gradient(180deg,#efe6cd,#cfc2a2);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.09)}
.vu svg{display:block;width:100%;height:auto}

.ptt{
  display:block;width:100%;border:0;cursor:pointer;touch-action:none;
  border-radius:13px;padding:clamp(22px,7vw,28px) 12px clamp(20px,6.5vw,26px);
  color:#fff4ea;font-family:var(--mono);font-size:clamp(14px,4.4vw,16px);font-weight:700;
  letter-spacing:.28em;text-indent:.28em;
  background:linear-gradient(180deg,var(--btn-hi),var(--btn) 55%,#a53f21);
  box-shadow:0 9px 0 var(--btn-lo),0 12px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35);
  text-shadow:0 1px 0 rgba(0,0,0,.35);
  transition:transform 70ms cubic-bezier(.2,.9,.3,1),box-shadow 70ms cubic-bezier(.2,.9,.3,1),filter 120ms;
}
.ptt small{display:block;font-size:clamp(8px,2.6vw,9px);letter-spacing:.18em;opacity:.72;
  font-weight:400;margin-top:6px;text-indent:.18em}
.ptt.down{transform:translateY(8px) scale(.995);
  box-shadow:0 1px 0 var(--btn-lo),0 2px 5px rgba(0,0,0,.5),inset 0 3px 9px rgba(0,0,0,.4);filter:brightness(1.12)}
.ptt:focus-visible{outline:3px solid var(--amber);outline-offset:4px}
.ptt.live{animation:pulse .9s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 1px 0 var(--btn-lo),0 0 0 5px rgba(255,58,32,.2),inset 0 3px 9px rgba(0,0,0,.4)}}

@media (max-width:859px){
  .ptt{
    position:sticky;
    bottom:calc(10px + env(safe-area-inset-bottom,0px));
    z-index:5;
  }
}

.row{display:flex;gap:10px;margin-top:clamp(11px,3.5vw,14px)}
.key{
  flex:1;min-height:46px;border:0;border-radius:8px;padding:12px 6px;cursor:pointer;font-family:var(--mono);
  font-size:clamp(10px,3.1vw,11.5px);letter-spacing:.14em;font-weight:700;color:#221f1a;
  background:linear-gradient(180deg,#cdc3a8,#a89d80);
  box-shadow:0 4px 0 #6f6650,0 6px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform 70ms,box-shadow 70ms;
}
.key:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 #6f6650,inset 0 2px 6px rgba(0,0,0,.35)}
.key:disabled{opacity:.4;cursor:default;box-shadow:0 4px 0 #6f6650,inset 0 1px 0 rgba(255,255,255,.25)}
.key.warn{background:linear-gradient(180deg,#b98f86,#9a6a60);color:#241512;
  box-shadow:0 4px 0 #5f3a33,0 6px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3)}

.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;
  font-size:clamp(8.5px,2.7vw,9.5px);letter-spacing:.1em;color:#8f877a}
.sw{display:flex;align-items:center;gap:7px;cursor:pointer;color:#cfc5b0}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:38px;height:20px;border-radius:10px;background:#191715;position:relative;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.8);transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:linear-gradient(180deg,#ded4bc,#9d947f);transition:transform .16s cubic-bezier(.3,1.4,.5,1)}
.sw input:checked + i{background:#4a3a18}
.sw input:checked + i::after{transform:translateX(18px);background:linear-gradient(180deg,#ffc964,#c98a20)}
.sw input:focus-visible + i{outline:2px solid var(--amber);outline-offset:2px}

.note{display:none;margin-top:12px;padding:10px 12px;border-radius:7px;font-size:clamp(11px,3.2vw,12px);line-height:1.55}
.note.show{display:block}
.note.bad{background:#4a2a20;color:#ffcdbd}
.note.tip{background:#2f3a26;color:#d6e6c2}
.note .acts2{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.note button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:5px;
  padding:7px 11px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;cursor:pointer;min-height:36px}

/* ---------------- library ---------------- */
.lib{background:var(--paper);border-radius:12px;padding:12px 12px 6px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.tabs{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:9px}
.tab{border:0;background:none;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:#7a7264;
  cursor:pointer;padding:6px 2px;border-bottom:2px solid transparent;min-height:34px}
.tab.sel{color:var(--ink);border-bottom-color:var(--btn)}
.tabs .sp{flex:1}
.tabs .mini{border:0;background:none;font-family:var(--mono);font-size:10.5px;color:#8c8474;
  cursor:pointer;letter-spacing:.06em;padding:6px 2px;min-height:34px}

.tape{padding:12px 2px;border-bottom:1px solid var(--line)}
.tape:last-child{border-bottom:0}
.t1{display:flex;align-items:baseline;gap:8px}
.nm{flex:1;min-width:0;font-size:clamp(13px,3.9vw,14.5px);font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm input{width:100%;font:inherit;padding:5px 6px;border:1px solid var(--btn);border-radius:4px;background:#fff;color:inherit}
.dur{flex:0 0 auto;font-size:12px;color:#6c6455;font-variant-numeric:tabular-nums}
.meta{font-size:clamp(9.5px,2.9vw,10.5px);color:#8c8474;margin-top:4px;letter-spacing:.04em}
.seek{height:8px;margin:10px 0 2px;border-radius:4px;background:#cfc7b5;cursor:pointer;overflow:hidden}
.seek i{display:block;height:100%;width:0;background:var(--btn)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:6px;margin-top:9px}
.acts button{border:1px solid var(--line);background:#f2ece0;border-radius:6px;min-height:40px;padding:6px 4px;
  font-family:var(--mono);font-size:clamp(9.5px,2.8vw,10.5px);letter-spacing:.08em;color:#3a352c;cursor:pointer}
.acts button:hover{background:#fff}
.acts button.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.empty{padding:26px 4px 30px;text-align:center;color:#8c8474;font-size:12.5px;line-height:1.75}
.foot{padding:11px 2px 9px;font-size:10px;color:#8c8474;letter-spacing:.06em;
  display:flex;justify-content:space-between;gap:8px}

@media (min-width:860px){
  .app{max-width:900px;display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .lib{position:sticky;top:22px}
}
@media (orientation:landscape) and (max-height:560px){
  .app{max-width:820px;display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .ptt{padding:18px 12px 16px}
  .grille{height:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">

  <div class="rig">
    <div class="head">
      <div class="grille"></div>
      <div class="mark"><b>RAMBLER 7</b><small>FIELD VOICE UNIT</small></div>
    </div>

    <div class="screen">
      <div class="lcd">
        <div class="lrow"><span id="state">STANDBY</span><span class="led" id="led"></span></div>
        <div class="clock ghost"><s>88:88.8</s><b id="clock">00:00.0</b></div>
        <div class="lrow"><span id="bursts">0 bursts</span><span id="src">Hold to open mic</span></div>
      </div>
      <div class="vu">
        <svg viewBox="0 0 100 62" aria-hidden="true">
          <path d="M8 52 A44 44 0 0 1 92 52" fill="none" stroke="#6f6650" stroke-width="1"/>
          <path d="M64 15.5 A44 44 0 0 1 92 52" fill="none" stroke="#b8402a" stroke-width="2.4"/>
          <g stroke="#6f6650" stroke-width="1">
            <line x1="10" y1="46" x2="14" y2="44"/><line x1="24" y1="26" x2="27" y2="29"/>
            <line x1="50" y1="16" x2="50" y2="20"/><line x1="73" y1="26" x2="70" y2="29"/>
            <line x1="90" y1="46" x2="86" y2="44"/>
          </g>
          <text x="50" y="60" font-size="6" fill="#6f6650" text-anchor="middle" font-family="monospace">VU</text>
          <line id="needle" x1="50" y1="54" x2="50" y2="20" stroke="#1b1915" stroke-width="1.6"
                stroke-linecap="round" style="transform-origin:50px 54px;transform:rotate(-52deg)"/>
          <circle cx="50" cy="54" r="3.2" fill="#2a2723"/>
        </svg>
      </div>
    </div>

    <button class="ptt" id="ptt" aria-label="Push to talk. Hold to record.">PUSH TO TALK<small>hold to record · release to pause</small></button>

    <div class="row">
      <button class="key" id="save" disabled>SAVE TAKE</button>
      <button class="key warn" id="scrap" disabled>SCRAP</button>
    </div>

    <div class="strip">
      <label class="sw"><input type="checkbox" id="hifi" checked><i></i><span id="hifiTxt">Hi-fi 48 kHz</span></label>
      <span>Space bar works too</span>
    </div>

    <div class="note bad" id="warn"></div>
    <div class="note tip" id="recover"></div>
  </div>

  <div class="lib">
    <div class="tabs">
      <button class="tab sel" data-view="takes">TAKES</button>
      <button class="tab" data-view="trash">TRASH</button>
      <span class="sp"></span>
      <button class="mini" id="bulk" hidden>Empty trash</button>
    </div>
    <div id="list"></div>
    <div class="foot"><span id="count"></span><span id="used"></span></div>
  </div>
</div>

<audio id="player" preload="metadata"></audio>

<script>
/* CORE:START — pure logic + storage, kept free of DOM so it can be unit tested */
var Core = (function(){
"use strict";
var DB="rambler7", VER=3, TAKES="takes", PARTS="parts";

function pad(n,w){ return String(n).padStart(w,"0"); }

function fmt(ms){
  var t=Math.max(0,ms||0)/1000;
  return pad(Math.floor(t/60),2)+":"+pad(Math.floor(t%60),2)+"."+Math.floor((t*10)%10);
}
function short(ms){
  var t=Math.max(0,ms||0)/1000;
  return Math.floor(t/60)+":"+pad(Math.floor(t%60),2);
}
function size(n){
  n=n||0;
  if(n<1024) return n+" B";
  if(n<1048576) return Math.round(n/1024)+" KB";
  return (n/1048576).toFixed(1)+" MB";
}
function cleanName(v, fallback){
  var s=String(v==null?"":v).replace(/[\u0000-\u001f\u007f]+/g," ").replace(/\s+/g," ").trim();
  if(s.length>60) s=s.slice(0,60).trim();
  return s || fallback || "Untitled take";
}
function fileName(it, ext){
  var base=String((it&&it.name)||"take").normalize("NFKD")
    .replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_").slice(0,50);
  if(!base) base="take";
  return base+"."+(ext||(it&&it.ext)||"webm");
}
function nextName(list){
  var max=0;
  (list||[]).forEach(function(it){
    var m=/^Take (\d+)$/.exec((it&&it.name)||"");
    if(m){ var n=parseInt(m[1],10); if(n>max) max=n; }
  });
  return "Take "+pad(max+1,3);
}
/* m4a first: it plays everywhere and needs no conversion. Browsers that cannot record
   it fall back to WebM, which is transcoded to MP3 when the take is saved. */
function pickMime(MR){
  var list=["audio/mp4;codecs=mp4a.40.2","audio/mp4","audio/aac",
            "audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  if(!MR || !MR.isTypeSupported) return "";
  for(var i=0;i<list.length;i++) if(MR.isTypeSupported(list[i])) return list[i];
  return "";
}
/* True for anything a phone or chat app will not open as-is. */
function needsConvert(mime){
  mime=mime||"";
  return !(mime.indexOf("mp4")>-1 || mime.indexOf("mpeg")>-1 || mime.indexOf("aac")>-1 || mime.indexOf("mp3")>-1);
}
function extFor(mime){
  mime=mime||"";
  if(mime.indexOf("mp4")>-1) return "m4a";
  if(mime.indexOf("ogg")>-1) return "ogg";
  return "webm";
}
/* Lifts a quiet recording to a normal listening level.
   Uses the 99.5th percentile rather than the absolute peak, so one cough or bumped
   microphone cannot hold the whole take down. The soft clipper catches the outliers. */
function levelGain(pcm){
  var n=pcm.length;
  if(!n) return 1;
  var bins=new Uint32Array(1024), sum=0, count=0, i, v, bi;
  var step = n>480000 ? Math.ceil(n/480000) : 1;      // long takes are sampled, not scanned
  for(i=0;i<n;i+=step){
    v=pcm[i]; sum+=v*v; v=v<0?-v:v;
    bi = v>=1 ? 1023 : (v*1024)|0;
    bins[bi]++; count++;
  }
  if(!count) return 1;
  var rms=Math.sqrt(sum/count);
  if(rms<1e-5) return 1;                              // silence stays silent
  var target=count*0.995, acc=0, loud=1;
  for(i=0;i<1024;i++){ acc+=bins[i]; if(acc>=target){ loud=(i+1)/1024; break; } }
  var g=Math.min(0.97/Math.max(loud,1e-6), 0.10/rms);
  return Math.max(0.25, Math.min(g, 16));
}
function softClip(v){
  if(v>0.9) return 0.9+0.1*Math.tanh((v-0.9)*10);
  if(v<-0.9) return -0.9+0.1*Math.tanh((v+0.9)*10);
  return v;
}
function toInt16(pcm, gain){
  var out=new Int16Array(pcm.length), i, v;
  for(i=0;i<pcm.length;i++){
    v=softClip(pcm[i]*gain);
    out[i]= v<0 ? Math.max(-32768, v*32768) : Math.min(32767, v*32767);
  }
  return out;
}
function joinBuffers(bufs){
  var total=0,i;
  for(i=0;i<bufs.length;i++) total+=bufs[i].byteLength;
  var out=new Uint8Array(total), off=0;
  for(i=0;i<bufs.length;i++){ out.set(new Uint8Array(bufs[i]),off); off+=bufs[i].byteLength; }
  return out.buffer;
}

function makeStore(idbFactory){
  var db=null, memory=false, mem={takes:new Map(), parts:new Map()};

  function open(){
    return new Promise(function(res){
      var req;
      if(!idbFactory){ memory=true; return res({ok:false,reason:"no-indexeddb"}); }
      try{ req=idbFactory.open(DB,VER); }
      catch(e){ memory=true; return res({ok:false,reason:"open-threw"}); }
      var done=false;
      var finish=function(v){ if(!done){ done=true; res(v); } };
      var timer=setTimeout(function(){ memory=true; finish({ok:false,reason:"timeout"}); },4000);
      req.onupgradeneeded=function(){
        var d=req.result;
        if(!d.objectStoreNames.contains(TAKES)) d.createObjectStore(TAKES,{keyPath:"id"});
        if(!d.objectStoreNames.contains(PARTS)) d.createObjectStore(PARTS,{keyPath:"key"});
      };
      req.onsuccess=function(){
        clearTimeout(timer); db=req.result;
        db.onversionchange=function(){ try{db.close();}catch(e){} db=null; memory=true; };
        finish({ok:true});
      };
      req.onerror=function(){ clearTimeout(timer); memory=true; finish({ok:false,reason:"error"}); };
      req.onblocked=function(){ clearTimeout(timer); memory=true; finish({ok:false,reason:"blocked"}); };
    });
  }

  function run(name, mode, fn){
    if(memory || !db) return null;
    return new Promise(function(res,rej){
      var tx;
      try{ tx=db.transaction(name,mode); }catch(e){ return rej(e); }
      var out;
      tx.oncomplete=function(){ res(out); };
      tx.onerror=function(){ rej(tx.error||new Error("tx error")); };
      tx.onabort=function(){ rej(tx.error||new Error("tx abort")); };
      try{ fn(tx.objectStore(name), function(v){ out=v; }); }
      catch(e){ try{tx.abort();}catch(e2){} rej(e); }
    });
  }

  function isQuota(e){
    return !!e && (e.name==="QuotaExceededError" || e.code===22 || /quota/i.test(e.message||""));
  }

  var api={
    get memory(){ return memory || !db; },
    open:open,

    all:function(){
      var p=run(TAKES,"readonly",function(s,set){ var r=s.getAll(); r.onsuccess=function(){ set(r.result||[]); }; });
      if(!p) return Promise.resolve(Array.from(mem.takes.values()));
      return p.catch(function(){ return Array.from(mem.takes.values()); });
    },

    get:function(id){
      var p=run(TAKES,"readonly",function(s,set){ var r=s.get(id); r.onsuccess=function(){ set(r.result||null); }; });
      if(!p) return Promise.resolve(mem.takes.get(id)||null);
      return p;
    },

    /* writes then reads back, so a silently failed write is reported instead of assumed */
    put:function(it){
      if(api.memory){ mem.takes.set(it.id, it); return Promise.resolve(it); }
      return run(TAKES,"readwrite",function(s){ s.put(it); })
        .then(function(){ return api.get(it.id); })
        .then(function(saved){
          if(!saved) throw new Error("write-not-persisted");
          if(it.buf && (!saved.buf || saved.buf.byteLength!==it.buf.byteLength)) throw new Error("write-truncated");
          return saved;
        })
        .catch(function(e){
          if(isQuota(e)){ var q=new Error("quota"); q.code="QUOTA"; throw q; }
          throw e;
        });
    },

    del:function(id){
      if(api.memory){ mem.takes.delete(id); return Promise.resolve(); }
      return run(TAKES,"readwrite",function(s){ s.delete(id); });
    },

    addPart:function(session, seq, buf){
      var rec={key:session+":"+pad(seq,6), session:session, seq:seq, buf:buf};
      if(api.memory){ mem.parts.set(rec.key,rec); return Promise.resolve(); }
      return run(PARTS,"readwrite",function(s){ s.put(rec); })
        .catch(function(e){ if(isQuota(e)){ var q=new Error("quota"); q.code="QUOTA"; throw q; } throw e; });
    },

    putDraft:function(meta){
      var rec=Object.assign({key:meta.session+":meta", meta:true}, meta);
      if(api.memory){ mem.parts.set(rec.key,rec); return Promise.resolve(); }
      return run(PARTS,"readwrite",function(s){ s.put(rec); }).catch(function(){});
    },

    parts:function(){
      var p=run(PARTS,"readonly",function(s,set){ var r=s.getAll(); r.onsuccess=function(){ set(r.result||[]); }; });
      if(!p) return Promise.resolve(Array.from(mem.parts.values()));
      return p.catch(function(){ return []; });
    },

    clearParts:function(session){
      if(api.memory){
        Array.from(mem.parts.keys()).forEach(function(k){ if(!session || k.indexOf(session+":")===0) mem.parts.delete(k); });
        return Promise.resolve();
      }
      return run(PARTS,"readwrite",function(s){
        var r=s.getAllKeys();
        r.onsuccess=function(){
          (r.result||[]).forEach(function(k){ if(!session || String(k).indexOf(session+":")===0) s.delete(k); });
        };
      }).catch(function(){});
    }
  };
  return api;
}

/* assembles orphaned chunks left behind by a crash into a recoverable take */
function recoverDraft(parts){
  var sessions={};
  (parts||[]).forEach(function(p){
    var s=sessions[p.session] || (sessions[p.session]={chunks:[], meta:null});
    if(p.meta) s.meta=p; else s.chunks.push(p);
  });
  var best=null;
  Object.keys(sessions).forEach(function(k){
    var s=sessions[k];
    if(!s.chunks.length) return;
    s.chunks.sort(function(a,b){ return a.seq-b.seq; });
    var bytes=s.chunks.reduce(function(n,c){ return n+c.buf.byteLength; },0);
    if(!best || bytes>best.bytes)
      best={session:k, bytes:bytes, chunks:s.chunks, meta:s.meta||{}};
  });
  if(!best) return null;
  return {
    session:best.session,
    bytes:best.bytes,
    buf:joinBuffers(best.chunks.map(function(c){ return c.buf; })),
    ms:best.meta.ms||0,
    bursts:best.meta.bursts||1,
    mime:best.meta.mime||"audio/webm",
    ext:best.meta.ext||extFor(best.meta.mime),
    at:best.meta.at||Date.now()
  };
}

return {
  fmt:fmt, short:short, size:size, cleanName:cleanName, fileName:fileName, nextName:nextName,
  pickMime:pickMime, extFor:extFor, joinBuffers:joinBuffers, makeStore:makeStore, recoverDraft:recoverDraft,
  levelGain:levelGain, softClip:softClip, toInt16:toInt16, needsConvert:needsConvert
};
})();
/* CORE:END */
</script>

<script>
(function(){
"use strict";
if(typeof document==="undefined") return;
var $=function(s){ return document.querySelector(s); };
var els={
  ptt:$("#ptt"), state:$("#state"), clock:$("#clock"), led:$("#led"), bursts:$("#bursts"), src:$("#src"),
  needle:$("#needle"), save:$("#save"), scrap:$("#scrap"), warn:$("#warn"), recover:$("#recover"),
  list:$("#list"), count:$("#count"), used:$("#used"), bulk:$("#bulk"), player:$("#player"),
  hifi:$("#hifi"), hifiTxt:$("#hifiTxt")
};
var store=Core.makeStore(window.indexedDB);

function warn(msg){ els.warn.textContent=msg; els.warn.classList.add("show"); }
function clearWarn(){ els.warn.classList.remove("show"); }

/* ---------------- capture ---------------- */
var MIME=Core.pickMime(window.MediaRecorder), EXT=Core.extFor(MIME);
var stream=null, recStream=null, rec=null, chunks=[], ac=null, analyser=null, tap=null, buf=null;
var lift=null, dest=null, convPct=-1;
var holding=false, wanted=false, armed=false, bursts=0, elapsed=0, burstAt=0;
var session=null, seq=0, level=0, hifi=true, saving=false, flashUntil=0;


/* ---------------- audio conversion ----------------
   Shared by the save path (WebM-only browsers) and the export path (older WebM takes). */
var lameLoading=null;
function loadEncoder(){
  if(window.lamejs) return Promise.resolve();
  if(lameLoading) return lameLoading;
  lameLoading=new Promise(function(res,rej){
    var sc=document.createElement("script");
    sc.src="lame.js";
    sc.onload=function(){ window.lamejs ? res() : rej(new Error("encoder")); };
    sc.onerror=function(){ rej(new Error("encoder")); };
    document.head.appendChild(sc);
  });
  return lameLoading;
}
function decodeMono(ab){
  return ctx().decodeAudioData(ab.slice(0)).then(function(audio){
    var n=audio.length, chans=audio.numberOfChannels, out=new Float32Array(n), k, i;
    for(k=0;k<chans;k++){
      var d=audio.getChannelData(k);
      for(i=0;i<n;i++) out[i]+=d[i]/chans;
    }
    return {pcm:out, rate:audio.sampleRate};
  });
}
/* Encodes in slices with a yield between them so the interface stays responsive. */
function encodeMp3(d, onProgress){
  var enc=new window.lamejs.Mp3Encoder(1, d.rate, 128);
  var gain=Core.levelGain(d.pcm), n=d.pcm.length, i=0, parts=[], BLOCK=1152*64;
  return new Promise(function(res){
    (function step(){
      var end=Math.min(i+BLOCK, n);
      var chunk=enc.encodeBuffer(Core.toInt16(d.pcm.subarray(i,end), gain));
      if(chunk.length) parts.push(chunk);
      i=end;
      if(onProgress) onProgress(i/n);
      if(i<n) setTimeout(step,0);
      else{
        var last=enc.flush();
        if(last.length) parts.push(last);
        res(new Blob(parts,{type:"audio/mpeg"}));
      }
    })();
  });
}
/* Returns the take in a format phones and chat apps can open. */
function toPortable(ab, mime, ext, onProgress){
  if(!Core.needsConvert(mime)) return Promise.resolve({buf:ab, mime:mime, ext:ext});
  return loadEncoder()
    .then(function(){ return decodeMono(ab); })
    .then(function(d){ return encodeMp3(d, onProgress); })
    .then(function(blob){ return blob.arrayBuffer(); })
    .then(function(out){ return {buf:out, mime:"audio/mpeg", ext:"mp3"}; });
}

function paint(){
  var live=elapsed + (holding ? performance.now()-burstAt : 0);
  els.clock.textContent=Core.fmt(live);
  els.bursts.textContent=bursts+(bursts===1?" burst":" bursts");
  els.state.textContent = saving ? (convPct>=0 ? "CONVERTING "+convPct+"%" : "SAVING")
    : holding ? "● RECORDING"
    : armed ? "HELD"
    : Date.now()<flashUntil ? "SAVED" : "STANDBY";
  els.led.classList.toggle("on", holding && Math.floor(Date.now()/380)%2===0);
  els.save.disabled=!armed||live<150||saving;
  els.scrap.disabled=!armed||saving;
  els.ptt.classList.toggle("live", holding);
  els.hifi.disabled=armed;
}
function loop(){
  if(analyser && holding){
    analyser.getByteTimeDomainData(buf);
    var sum=0;
    for(var i=0;i<buf.length;i++){ var v=(buf[i]-128)/128; sum+=v*v; }
    level=Math.max(level*0.82, Math.min(1, Math.sqrt(sum/buf.length)*3.4));
  } else level*=0.88;
  var deg=-52+level*104+(holding?(Math.random()-0.5)*3:0);
  els.needle.style.transform="rotate("+deg.toFixed(1)+"deg)";
  paint();
  requestAnimationFrame(loop);
}
function ctx(){
  if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==="suspended") ac.resume();
  return ac;
}
function click(down){
  try{
    var c=ctx(), n=1024, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
    var s=c.createBufferSource(); s.buffer=b;
    var f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=down?1500:2500; f.Q.value=1.1;
    var g=c.createGain(); g.gain.value=down?0.2:0.12;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  }catch(e){}
}
function buzz(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

function constraints(){
  return { audio: hifi
    ? {echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1, sampleRate:48000, sampleSize:16}
    : {echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1} };
}
function dropStream(){
  if(stream){ stream.getTracks().forEach(function(t){ try{t.stop();}catch(e){} }); stream=null; }
  if(tap){ try{tap.disconnect();}catch(e){} tap=null; }
  if(lift){ try{lift.disconnect();}catch(e){} lift=null; }
  analyser=null; dest=null; recStream=null;
}
function openMic(){
  if(stream) return Promise.resolve(true);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
    warn("This browser cannot record audio. Try a current Chrome, Edge, Firefox or Safari.");
    return Promise.resolve(false);
  }
  if(!MIME){ warn("No supported recording format in this browser."); return Promise.resolve(false); }
  els.src.textContent="Opening mic";
  return navigator.mediaDevices.getUserMedia(constraints()).then(function(s){
    stream=s;
    s.getAudioTracks().forEach(function(t){
      t.onended=function(){ warn("The microphone went away. Reconnect it and hold again."); release(); dropStream(); };
    });
    var c=ctx();
    /* Raw mic input is quiet, especially in hi-fi mode where auto gain is off.
       Record through a lift-and-limit chain so the saved file is at a usable level. */
    tap=c.createMediaStreamSource(s);
    var hp=c.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=75;   // room rumble
    lift=c.createGain(); lift.gain.value=hifi?3.2:1.6;
    var lim=c.createDynamicsCompressor();
    lim.threshold.value=-8; lim.knee.value=6; lim.ratio.value=12;
    lim.attack.value=0.003; lim.release.value=0.18;
    dest=c.createMediaStreamDestination();
    analyser=c.createAnalyser(); analyser.fftSize=1024; buf=new Uint8Array(analyser.fftSize);
    tap.connect(hp); hp.connect(lift); lift.connect(lim); lim.connect(dest);
    lim.connect(analyser);                       // meter shows the level actually being written
    recStream=dest.stream;
    var set=s.getAudioTracks()[0].getSettings ? s.getAudioTracks()[0].getSettings() : {};
    els.src.textContent=(set.sampleRate?Math.round(set.sampleRate/1000)+" kHz":"Mic live")+(hifi?" hi-fi":" voice");
    clearWarn();
    return true;
  }).catch(function(err){
    els.src.textContent="Mic blocked";
    warn(err && err.name==="NotAllowedError"
      ? "Microphone permission was refused. Allow the mic for this page and hold again. In an embedded preview you may need to open the file in its own tab."
      : "No microphone was found or it is in use by another app.");
    return false;
  });
}

function press(){
  if(holding||saving||wanted) return;
  wanted=true;
  els.ptt.classList.add("down");
  click(true); buzz(12);
  openMic().then(function(ok){
    if(!ok||!wanted){ els.ptt.classList.remove("down"); wanted=false; return; }
    if(holding) return;
    if(!rec){
      chunks=[]; elapsed=0; bursts=0; seq=0;
      session="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      try{
        rec=new MediaRecorder(recStream||stream,{mimeType:MIME, audioBitsPerSecond:128000});
      }catch(e){
        try{ rec=new MediaRecorder(recStream||stream,{mimeType:MIME}); }
        catch(e2){ warn("Recording could not start in this browser."); return; }
      }
      rec.ondataavailable=function(e){
        if(!e.data||!e.data.size) return;
        chunks.push(e.data);
        var n=seq++;
        e.data.arrayBuffer().then(function(b){
          return store.addPart(session,n,b);
        }).catch(function(err){
          if(err&&err.code==="QUOTA") warn("Device storage is full, so the crash backup stopped. Save or delete takes to free space.");
        });
      };
      rec.onerror=function(){ warn("The recorder hit an error. Save what you have."); release(); };
      rec.start(1000);
    } else if(rec.state==="paused"){
      rec.resume();
    }
    holding=true; armed=true; bursts++; burstAt=performance.now();
    store.putDraft({session:session, ms:elapsed, bursts:bursts, mime:MIME, ext:EXT, at:Date.now()});
    paint();
  });
}
function release(){
  wanted=false;
  els.ptt.classList.remove("down");
  if(!holding) return;
  elapsed+=performance.now()-burstAt;
  holding=false;
  if(rec&&rec.state==="recording"){ try{ rec.requestData(); rec.pause(); }catch(e){} }
  click(false); buzz(8);
  store.putDraft({session:session, ms:elapsed, bursts:bursts, mime:MIME, ext:EXT, at:Date.now()});
  paint();
}

function finish(keep){
  if(!rec||saving) return;
  saving=true; paint();
  var took=Math.round(elapsed), count=bursts, sess=session;
  rec.onstop=function(){
    var parts=chunks.slice();
    rec=null; chunks=[];
    if(!keep||!parts.length){
      elapsed=0; bursts=0; armed=false; saving=false; convPct=-1; session=null;
      store.clearParts(sess); paint(); return;
    }
    new Blob(parts,{type:MIME}).arrayBuffer().then(function(ab){
      return toPortable(ab, MIME, EXT, function(p){ convPct=Math.round(p*100); paint(); });
    }).then(function(file){
      return store.all().then(function(all){
        return store.put({
          id:Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7),
          name:Core.nextName(all), buf:file.buf, mime:file.mime, ext:file.ext,
          ms:took, bursts:count, at:Date.now(), trashed:false
        });
      });
    }).then(function(){
      return store.clearParts(sess);
    }).then(function(){
      elapsed=0; bursts=0; armed=false; saving=false; convPct=-1; session=null;
      flashUntil=Date.now()+2200;
      view="takes"; syncTabs(); render(); paint();
    }).catch(function(e){
      saving=false; convPct=-1; paint();
      warn(e&&e.code==="QUOTA"
        ? "Device storage is full. Delete some takes, then hit Save take again. Your audio is still held."
        : "Saving failed, so the take was kept in the recorder. Try Save take again.");
    });
  };
  try{ rec.stop(); }
  catch(e){ rec=null; armed=false; saving=false; paint(); }
}

/* ---------------- input ---------------- */
els.ptt.addEventListener("pointerdown", function(e){
  e.preventDefault();
  try{ els.ptt.setPointerCapture(e.pointerId); }catch(err){}
  press();
});
els.ptt.addEventListener("pointerup", release);
els.ptt.addEventListener("pointercancel", release);
els.ptt.addEventListener("contextmenu", function(e){ e.preventDefault(); });
els.ptt.addEventListener("selectstart", function(e){ e.preventDefault(); });
els.ptt.addEventListener("dragstart", function(e){ e.preventDefault(); });
window.addEventListener("blur", release);
document.addEventListener("visibilitychange", function(){ if(document.hidden) release(); });
window.addEventListener("pagehide", function(){ release(); dropStream(); });
window.addEventListener("orientationchange", function(){ release(); });
if(window.screen && screen.orientation) screen.orientation.addEventListener("change", function(){ release(); });
window.addEventListener("beforeunload", function(e){
  if(armed){ e.preventDefault(); e.returnValue=""; }
});
document.addEventListener("keydown", function(e){
  var a=document.activeElement;
  if(a&&a.tagName==="INPUT") return;
  var onPtt=(a===els.ptt);
  if(a&&a.tagName==="BUTTON"&&!onPtt) return;      // other buttons keep their own space/enter
  if(e.code==="Space"||(onPtt&&e.key==="Enter")){
    if(e.repeat) return;
    e.preventDefault(); press();
  }
});
document.addEventListener("keyup", function(e){
  if(e.code==="Space"||e.key==="Enter") release();
});
els.save.addEventListener("click", function(){ release(); finish(true); });
els.scrap.addEventListener("click", function(){ release(); finish(false); });
els.hifi.addEventListener("change", function(){
  hifi=els.hifi.checked;
  els.hifiTxt.textContent=hifi?"Hi-fi 48 kHz":"Voice clean-up";
  dropStream();
  els.src.textContent="Hold to open mic";
});

/* ---------------- library ---------------- */
var view="takes", playing=null, url=null, editing=null, fillEl=null, fillMs=0, nodes={};

function syncTabs(){
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
    t.classList.toggle("sel", t.dataset.view===view);
  });
  els.bulk.hidden=view!=="trash";
}
Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
  t.addEventListener("click", function(){ view=t.dataset.view; syncTabs(); render(); });
});

function stamp(ts){
  var d=new Date(ts);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+
         d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function blobOf(it){ return new Blob([it.buf],{type:it.mime||"audio/webm"}); }

function render(){
  return store.all().then(function(all){
    all.sort(function(a,b){ return b.at-a.at; });
    var rows=all.filter(function(x){ return !!x.trashed===(view==="trash"); });
    fillEl=null; nodes={};
    els.list.innerHTML="";
    if(!rows.length){
      var p=document.createElement("p"); p.className="empty";
      p.innerHTML=view==="trash" ? "Nothing in the trash." : "No takes yet.<br>Hold the orange bar and speak.";
      els.list.appendChild(p);
    }
    rows.forEach(function(it){ els.list.appendChild(rowFor(it)); });
    var live=all.filter(function(x){ return !x.trashed; });
    els.count.textContent=live.length+(live.length===1?" take":" takes")+(store.memory?" · session only":"");
    els.used.textContent=Core.size(all.reduce(function(n,x){ return n+(x.buf?x.buf.byteLength:0); },0));
  });
}

function rowFor(it){
  var el=document.createElement("div"); el.className="tape";
  var t1=document.createElement("div"); t1.className="t1";
  var nm=document.createElement("div"); nm.className="nm";

  if(editing===it.id){
    var inp=document.createElement("input");
    inp.value=it.name; inp.maxLength=60; inp.setAttribute("aria-label","Take name");
    var done=false;
    var commit=function(save){
      if(done) return; done=true; editing=null;
      var next=Core.cleanName(inp.value, it.name);
      if(save&&next!==it.name){ it.name=next; store.put(it).catch(function(){ warn("Renaming failed. The old name is still in place."); }).then(render); }
      else render();
    };
    inp.addEventListener("keydown", function(e){
      if(e.key==="Enter"){ e.preventDefault(); commit(true); }
      if(e.key==="Escape"){ e.preventDefault(); commit(false); }
    });
    inp.addEventListener("blur", function(){ commit(true); });
    nm.appendChild(inp);
    setTimeout(function(){ inp.focus(); inp.select(); },0);
  } else {
    nm.textContent=it.name;
  }

  var dur=document.createElement("span"); dur.className="dur"; dur.textContent=Core.short(it.ms);
  t1.appendChild(nm); t1.appendChild(dur);

  var meta=document.createElement("div"); meta.className="meta";
  meta.textContent=stamp(it.at)+" · "+it.bursts+(it.bursts===1?" burst":" bursts")+
    " · "+Core.size(it.buf?it.buf.byteLength:0)+" · "+String(it.ext||"webm").toUpperCase()+
    (Core.needsConvert(it.mime)?" (converts on export)":"");

  var seek=document.createElement("div"); seek.className="seek";
  var fill=document.createElement("i"); seek.appendChild(fill);
  seek.addEventListener("click", function(e){
    if(playing!==it.id) return;
    var r=seek.getBoundingClientRect();
    var p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    var d=els.player.duration;
    try{ els.player.currentTime=p*((isFinite(d)&&d>0)?d:it.ms/1000); }catch(err){}
  });
  nodes[it.id]={fill:fill, ms:it.ms};
  if(playing===it.id){ fillEl=fill; fillMs=it.ms; }

  var acts=document.createElement("div"); acts.className="acts";
  function add(label, cls, fn){
    var b=document.createElement("button"); b.textContent=label;
    if(cls) b.className=cls;
    b.addEventListener("click", fn); acts.appendChild(b);
    nodes[it.id][label]=b;
    return b;
  }
  if(!it.trashed){
    add("PLAY","pri",function(){ toggle(it); }).textContent = (playing===it.id)?"STOP":"PLAY";
    add("RENAME","",function(){ editing=it.id; render(); });
    add("SHARE","",function(){ share(it); });
    add("DOWNLOAD","",function(){ download(it); });
    add("TRASH","",function(){
      stopIf(it.id); it.trashed=true;
      store.put(it).catch(function(){ warn("That take could not be moved to the trash."); }).then(render);
    });
  } else {
    add("RESTORE","pri",function(){
      it.trashed=false;
      store.put(it).catch(function(){ warn("Restore failed."); }).then(render);
    });
    add("DELETE FOREVER","",function(){
      stopIf(it.id);
      delete exportCache[it.id];
      store.del(it.id).then(render);
    });
  }

  el.appendChild(t1); el.appendChild(meta); el.appendChild(seek); el.appendChild(acts);
  return el;
}

function stopIf(id){ if(playing===id){ els.player.pause(); playing=null; } }

/* Updates just the affected rows. Re-rendering the whole list on every play or pause
   rebuilt the progress bar mid-playback, which is what made the transport stutter. */
function setPlayUI(){
  Object.keys(nodes).forEach(function(id){
    var n=nodes[id];
    if(n.PLAY) n.PLAY.textContent = (playing===id) ? "STOP" : "PLAY";
    if(n.fill && playing!==id) n.fill.style.width="0%";
  });
  if(playing && nodes[playing]){ fillEl=nodes[playing].fill; fillMs=nodes[playing].ms; }
  else fillEl=null;
}

function toggle(it){
  if(playing===it.id){ els.player.pause(); playing=null; setPlayUI(); return; }
  if(url) URL.revokeObjectURL(url);
  url=URL.createObjectURL(blobOf(it));
  playing=it.id;
  setPlayUI();

  var begin=function(){
    els.player.play().catch(function(){
      playing=null; setPlayUI();
      warn("Playback was blocked. Tap PLAY again.");
    });
  };
  /* Recorded WebM often reports an unknown duration. Resolving it before playing,
     rather than seeking after playback has already started, removes the stutter. */
  els.player.onloadedmetadata=function(){
    els.player.onloadedmetadata=null;
    if(isFinite(els.player.duration) && els.player.duration>0) return begin();
    els.player.ontimeupdate=function(){
      els.player.ontimeupdate=null;
      try{ els.player.currentTime=0; }catch(e){}
      begin();
    };
    try{ els.player.currentTime=1e101; }catch(e){ begin(); }
  };
  els.player.src=url;
  els.player.load();
}
els.player.addEventListener("ended", function(){ playing=null; setPlayUI(); });
els.player.addEventListener("timeupdate", function(){
  if(!playing||!fillEl) return;
  var d=els.player.duration, total=(isFinite(d)&&d>0)?d:fillMs/1000;
  fillEl.style.width=Math.min(100,(els.player.currentTime/total)*100)+"%";
});

/* ---------------- export ----------------
   Takes are recorded as m4a wherever the browser allows it, so no conversion is needed.
   Browsers that can only produce WebM get one MP3 pass at save time. Older takes already
   sitting in the library as WebM are converted the first time they are shared. */
var exportCache={};



/* Encodes in slices with a yield between them so the interface stays responsive. */

/* Returns a file every phone and chat app can actually open. */
function exportFile(it, onProgress){
  if(exportCache[it.id]) return Promise.resolve(exportCache[it.id]);
  if(!Core.needsConvert(it.mime)){
    var asis={blob:blobOf(it), name:Core.fileName(it)};      // recorded in a portable format
    exportCache[it.id]=asis;
    return Promise.resolve(asis);
  }
  return loadEncoder()
    .then(function(){ return decodeMono(it.buf); })
    .then(function(d){ return encodeMp3(d, onProgress); })
    .then(function(blob){
      var out={blob:blob, name:Core.fileName(it,"mp3")};
      exportCache[it.id]=out;
      return out;
    });
}

function withExport(it, label, fn){
  var node=nodes[it.id] && nodes[it.id][label];
  var restore=node ? node.textContent : null;
  if(node){ node.disabled=true; node.textContent="0%"; }
  var show=function(p){ if(node) node.textContent=Math.round(p*100)+"%"; };
  return exportFile(it, show).then(function(out){
    if(node){ node.disabled=false; node.textContent=restore; }
    fn(out);
  }).catch(function(){
    if(node){ node.disabled=false; node.textContent=restore; }
    warn("That take could not be converted for sharing. It is still safe in your library.");
  });
}

function share(it){
  withExport(it, "SHARE", function(out){
    var file;
    try{ file=new File([out.blob], out.name, {type:out.blob.type}); }
    catch(e){ return saveToDisk(out); }
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:it.name}).catch(function(err){
        if(!err||err.name!=="AbortError") saveToDisk(out);
      });
    } else saveToDisk(out);
  });
}

function download(it){
  withExport(it, "DOWNLOAD", saveToDisk);
}

function saveToDisk(out){
  var u=URL.createObjectURL(out.blob);
  var a=document.createElement("a");
  a.href=u; a.download=out.name; a.rel="noopener";
  document.body.appendChild(a); a.click(); a.remove();
  /* Sandboxed frames and iOS Safari ignore the download attribute, so offer the file
     in a tab as a fallback rather than failing silently. */
  setTimeout(function(){
    if(!downloadWorks()){
      var w=window.open(u,"_blank");
      if(!w) warn("Downloads are blocked here. Open this page in its own browser tab to save or share takes.");
    }
    setTimeout(function(){ URL.revokeObjectURL(u); },20000);
  },400);
}
function downloadWorks(){
  var a=document.createElement("a");
  if(!("download" in a)) return false;
  try{ return window.self===window.top; }catch(e){ return false; }   // cross-origin frame
}
els.bulk.addEventListener("click", function(){
  store.all().then(function(all){
    return Promise.all(all.filter(function(x){ return x.trashed; }).map(function(x){
      stopIf(x.id); return store.del(x.id);
    }));
  }).then(render);
});

/* ---------------- boot ---------------- */
store.open().then(function(r){
  if(!r.ok) warn("Saved takes are unavailable here, so this session keeps them in memory only. Open the file in its own browser tab to keep them for good.");
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){});
  return store.parts();
}).then(function(parts){
  var draft=Core.recoverDraft(parts);
  if(!draft) return;
  els.recover.innerHTML="";
  var p=document.createElement("div");
  p.textContent="An unsaved take from "+stamp(draft.at)+" was found ("+Core.short(draft.ms)+", "+Core.size(draft.bytes)+"). It was interrupted before you saved it.";
  var box=document.createElement("div"); box.className="acts2";
  var keep=document.createElement("button"); keep.textContent="Recover it";
  var drop=document.createElement("button"); drop.textContent="Discard";
  keep.addEventListener("click", function(){
    keep.disabled=true; drop.disabled=true; keep.textContent="Recovering";
    toPortable(draft.buf, draft.mime, draft.ext, function(pr){
      keep.textContent="Recovering "+Math.round(pr*100)+"%";
    }).then(function(file){
      return store.all().then(function(all){
        return store.put({
          id:Date.now().toString(36)+"-r", name:Core.nextName(all), buf:file.buf, mime:file.mime,
          ext:file.ext, ms:draft.ms, bursts:draft.bursts, at:draft.at, trashed:false
        });
      });
    }).then(function(){
      return store.clearParts(draft.session);
    }).then(function(){ els.recover.classList.remove("show"); render(); })
      .catch(function(){
        keep.disabled=false; drop.disabled=false; keep.textContent="Recover it";
        warn("The recovered take could not be saved.");
      });
  });
  drop.addEventListener("click", function(){
    store.clearParts(draft.session).then(function(){ els.recover.classList.remove("show"); });
  });
  box.appendChild(keep); box.appendChild(drop);
  els.recover.appendChild(p); els.recover.appendChild(box);
  els.recover.classList.add("show");
}).then(function(){
  syncTabs(); render(); paint();
  requestAnimationFrame(loop);
});
})();

/* Offline support. Only meaningful over http(s), so opening the file directly still works. */
(function(){
  if(!("serviceWorker" in navigator)) return;
  if(location.protocol!=="https:" && location.hostname!=="localhost" && location.hostname!=="127.0.0.1") return;
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("/sw.js").then(function(reg){
      reg.update();
    }).catch(function(){ /* offline support is optional, never block the app */ });
  });
})();
</script>
